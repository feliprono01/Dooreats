spring.application.name=dooreatsapi

# FORZAR que escuche en TODAS las interfaces
server.address=0.0.0.0
server.port=8080

# Configuración de red
management.server.address=0.0.0.0

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dooreats_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 deshabilitado
spring.h2.console.enabled=false

# JWT Secret
jwt.secret=${JWT_SECRET:cambia-este-valor-por-una-clave-secreta-propia-en-produccion}