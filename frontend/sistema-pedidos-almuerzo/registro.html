<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dooreats - Registro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="assets/logo.png" alt="Dooreats" class="logo">
      <h1 class="titulo">Registro de Usuario</h1>

      <form id="registerForm">
        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez" required>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
        </div>

        <!-- Confirmación -->
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn-primary">Crear cuenta</button>
      </form>

      <p class="register-link">
        ¿Ya tenés cuenta? <a href="index.html">Iniciar sesión</a>
      </p>

      <div id="regMessage" class="message"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
