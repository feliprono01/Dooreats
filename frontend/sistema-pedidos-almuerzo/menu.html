<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dooreats - Menú Semanal</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="navbar">
    <a href="menu.html">
      <img src="assets/logo.png" alt="Dooreats" class="logo">
    </a>

    <h2>Bienvenido <span id="usuarioHeader"></span></h2>

    <div class="header-actions">
      <a href="perfil.html" class="btn-nav btn-nav--outline">
        Mi Perfil
      </a>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <!-- Contenedor principal -->
  <div class="page-container">
    <!-- Título de página -->
    <header class="page-header">
      <h1 class="titulo">Menú Semanal</h1>
    </header>

    <main>
      <!-- Contenedor dinámico de menús -->
      <div id="menuContainer" class="menu-container">
        <!-- Aquí se cargan dinámicamente los menús -->
      </div>

      <!-- Bloque de botones juntos -->
      <div class="menu-actions">
        <button id="guardarPedido" class="btn-primary">Guardar Pedido</button>
        <button onclick="window.location.href='asistencia.html'" class="btn-secondary">
          Cambiar días de asistencia
        </button>
      </div>

      <div id="menuMessage" class="message"></div>
    </main>
  </div>

 
  <script src="js/auth.js"></script>
  
  <!-- Scripts de la funcionalidad del menú -->
  <script src="js/pedidos.js"></script>
  <script src="js/main.js"></script>
  
  <!-- Script de inicialización -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      console.log(' Página de menú cargada');
      requireLogin("empleado");
      mostrarUsuarioEnHeader("usuarioHeader");
    });
  </script>
</body>

</html>
