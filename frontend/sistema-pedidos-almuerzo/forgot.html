<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar contraseña</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="assets/logo.png" alt="Dooreats" class="logo">
      <h1 class="titulo">Recuperar contraseña</h1>
      <form id="forgotForm">
        <div class="form-group">
          <label for="forgotEmail">Correo</label>
          <input type="email" id="forgotEmail" placeholder="tu@correo.com" required />
        </div>
        <button class="btn-primary" type="submit">Enviar código</button>
      </form>

      <div id="forgotMsg" class="message" style="margin-top:12px;"></div>

      <!-- Modo demo: mostramos el código acá -->
      <div id="codigoDemo" style="margin-top:12px; display:none;">
        <small>Código generado (demo): <strong id="codigoValor"></strong></small>
      </div>

      <div style="margin-top:14px; text-align:center;">
        <a href="reset.html">Ya tengo un código</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
