<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restablecer contraseña</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="assets/logo.png" alt="Dooreats" class="logo">
      <h1 class="titulo">Restablecer contraseña</h1>
      <form id="resetForm">
        <div class="form-group">
          <label for="resetEmail">Correo</label>
          <input type="email" id="resetEmail" placeholder="tu@correo.com" required />
        </div>
        <div class="form-group">
          <label for="resetCode">Código</label>
          <input type="text" id="resetCode" placeholder="Código de 6 dígitos" required />
        </div>
        <div class="form-group">
          <label for="newPass">Nueva contraseña</label>
          <input type="password" id="newPass" placeholder="••••••" required />
        </div>
        <button class="btn-primary" type="submit">Cambiar contraseña</button>
      </form>
      <div id="resetMsg" class="message" style="margin-top:12px;"></div>
      <div style="margin-top:14px; text-align:center;">
        <a href="index.html">Volver al inicio</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
