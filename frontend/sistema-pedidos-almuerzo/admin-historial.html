<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width-device-width, initial-scale=1.0"/>
  <title>Dooreats - Historial de Pedidos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <a href="admin-panel.html" class="nav-left">
      <img src="assets/logo.png" alt="Dooreats" class="logo">
    </a>

    <h2 class="nav-title">Historial de Pedidos</h2>

    <div class="header-actions header-actions--stack">
      <button class="btn-light" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="page-container">
    <h1 class="titulo">Historial</h1>

    <div class="filtros">
      <label for="filtroDia">Día:</label>
      <select id="filtroDia">
        <option value="">Todos</option>
        <option value="LUNES">Lunes</option>
        <option value="MARTES">Martes</option>
        <option value="MIERCOLES">Miércoles</option>
        <option value="JUEVES">Jueves</option>
        <option value="VIERNES">Viernes</option>
      </select>

      <label for="filtroEstado">Estado:</label>
      <select id="filtroEstado">
        <option value="">Todos</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="EN_PREPARACION">En preparación</option>
        <option value="ENVIADO_A_COCINA">Enviado a cocina</option>
        <option value="ENTREGADO">Entregado</option>
      </select>

      <label for="filtroTexto">Buscar:</label>
      <input id="filtroTexto" type="text" placeholder="Empleado o plato..." style="padding:8px;border:1px solid #ddd;border-radius:8px">

      <button id="btnFiltrar" class="btn-primary" style="width:auto;min-width:140px;">Aplicar</button>
      <button id="btnLimpiar" class="btn-secondary" style="width:auto;min-width:140px;">Limpiar</button>
    </div>

    <div id="historialMessage" class="message" style="margin-top: 15px;"></div>
    <p id="historialCount" style="margin-top:10px; margin-bottom:10px; color:#555;"></p>

    <div id="historialContainer" class="pedido-resumen"></div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin-historial.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      requireLogin("admin");
    });
  </script>
</body>
</html>
