<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dooreats - Usuario</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header class="navbar">
    <a href="admin-usuarios.html" class="nav-left">
      <img src="assets/logo.png" alt="Dooreats" class="logo"/>
    </a>
    <h2 class="nav-title">Nuevo / Editar Usuario</h2>
    <div class="header-actions">
      <button class="btn-light" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="page-container">
    <h1 class="titulo" id="formTitulo">Alta de Usuario</h1>

    <form id="usuarioForm" class="form-admin" style="max-width:600px;margin:0 auto;">
      <input type="hidden" id="usuarioId"/>

      <div class="grid-2">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required placeholder="Ej: Juan"/>
        </div>
        <div>
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" required placeholder="Ej: Pérez"/>
        </div>
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="ejemplo@empresa.com"/>

      <div class="grid-3">
        <div>
          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" placeholder="+54 9 11..."/>
        </div>
        <div>
          <label for="area">Área</label>
          <input type="text" id="area" placeholder="Sistemas"/>
        </div>
        <div>
          <label for="oficina">Oficina</label>
          <input type="text" id="oficina" placeholder="Piso 2"/>
        </div>
      </div>

      <label for="rol">Rol</label>
      <select id="rol" required>
        <option value="ROLE_EMPLEADO">Empleado</option>
        <option value="ROLE_ADMIN">Administrador</option>
      </select>

      <div id="passwordBlock">
        <label for="password">Contraseña (solo para alta)</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres"/>
      </div>

      <div class="botones-confirmacion">
        <button type="submit" class="btn-primary" style="width:auto;min-width:140px;">Guardar</button>
        <a href="admin-usuarios.html" class="btn-repetir" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-width:120px;">Cancelar</a>
      </div>
      <div id="formMsg" class="message"></div>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin-usuario-form.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      requireLogin("admin");
      
    });
  </script>
</body>
</html>
