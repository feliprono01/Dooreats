<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dooreats - Historial de Pedidos</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Navbar -->
  <header class="navbar">
    <a href="menu.html">
      <img src="assets/logo.png" alt="Dooreats" class="logo">
    </a>

    <h2>Historial de <span id="usuarioHeader"></span> (empleado)</h2>

    <div class="header-actions">
      <a href="perfil.html" class="btn-nav btn-nav--outline">
        Mi Perfil
      </a>
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </header>


  <div class="page-container">
    <header class="page-header">
      <h1 class="titulo">Historial de Pedidos</h1>
    </header>

    <main>
      <div id="historialContainer" class="pedido-resumen">
        <!-- Aquí se cargan los pedidos anteriores -->
      </div>
      <div id="historialMessage" class="message"></div>
    </main>
  </div>

  <script src="js/auth.js"></script>     <script src="js/main.js"></script>
  <script src="js/pedidos.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      requireLogin("empleado"); 
      mostrarUsuarioEnHeader("usuarioHeader"); 
      listarHistorial(); 
    });
  </script>
</body>
</html>
